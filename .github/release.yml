changelog:
  exclude:
    labels:
      - "autorelease: pending"
      - "autorelease: tagged"
      - autorelease
      - automated
    authors:
      - dependabot
  categories:
    - title: "🚀 Features"
      labels:
        - C-Feature
    - title: "🐛 Bug Fixes"
      labels:
        - C-Bug
    - title: "⚡ Performance"
      labels:
        - C-Performance
    - title: "🧭 Usability"
      labels:
        - C-Usability
    - title: "🚜 Refactor"
      labels:
        - C-Code-Quality
    - title: "🌍 Localization"
      labels:
        - C-Localization
    - title: "📚 Documentation"
      labels:
        - C-Documentation
    - title: "⚙️ Other Changes"
      labels:
        - "*"
