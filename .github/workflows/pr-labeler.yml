name: PR Labeler

# The called workflow skips fork PRs (read-only token) and only reads the title.
on:
  pull_request:
    branches: [master]
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  label:
    uses: Xerrion/wow-workflows/.github/workflows/pr-labeler.yml@main
