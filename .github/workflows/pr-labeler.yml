name: PR Labeler

# pull_request_target so fork PRs get a token that can label them. This is the
# one deliberate exception to the pull_request rule: the called workflow never
# checks out PR code and only reads the title.
on:
  pull_request_target:
    branches: [master]
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  label:
    uses: Xerrion/wow-workflows/.github/workflows/pr-labeler.yml@main
